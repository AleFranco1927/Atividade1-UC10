<main>
    <section id="secao-login">
        <h2>Login</h2>
        <p>Entre com seu usuário e senha</p>
        <form class="row g-3">
        
              <label for="staticUsuario" class="visually-hidden">Usuário</label>
              <input type="text" class="form-control" id="idstaticUsuario" placeholder="email@examplo.com">
            
           
              <label for="inputPassword2" class="visually-hidden">Senha</label>
              <input type="password" class="form-control" id="inputPassword2" placeholder="Senha">
           
              <button type="submit" class="btn btn-primary mb-3">Entrar</button>
            
          </form>
    </section>
</main>
